[project]
name = "titanic-kaggle"
version = "0.1.0"
description = "Repository for Titanic Kaggle competition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "ipykernel>=7.2.0",
    "kagglehub>=1.0.0",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.9",
    "mlflow>=2.20",
    "mypy>=1.20.2",
    "numpy>=2.4.4",
    "pandas>=2.2,<3",
    "polars>=1.40.1",
    "pyyaml>=6.0.3",
    "ruff>=0.15.12",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "types-pyyaml>=6.0.12.20260408",
    "xgboost>=3.2.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
