[project]
name = "titanic-kaggle"
version = "0.1.0"
description = "Repository for Titanic Kaggle competition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "ipykernel>=7.2.0",
    "kagglehub>=1.0.0",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.9",
    "mlflow>=2.20",
    "mypy>=1.20.2",
    "numpy>=2.4.4",
    "pandas>=2.2,<3",
    "polars>=1.40.1",
    "pyyaml>=6.0.3",
    "ruff>=0.15.12",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
    "types-pyyaml>=6.0.12.20260408",
    "xgboost>=3.2.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # simplify
]
ignore = []

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
