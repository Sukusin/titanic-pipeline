experiment:
  name: "catboost_classifier"
  seed: &seed 42

data:
  target: "Survived"
  original:
    train_path: "data/processed/raw/train_dataset.parquet"
    test_path: "data/processed/raw/test_dataset.parquet"
  binned:
    train_path: "data/processed/raw/train_dataset.parquet"
    test_path: "data/processed/raw/test_dataset.parquet"

validation:
  type: "stratified_kfold"
  n_splits: 5
  shuffle: true
  random_state: *seed

metrics:
  primary: "f1"
  log:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"

preprocessing:
  scaler: "standard"

model:
  name: "catboost_classifier"
  params:
    iterations: 300
    learning_rate: 0.03
    depth: 4
    l2_leaf_reg: 3.0
    loss_function: "Logloss"
    eval_metric: "Accuracy"
    random_seed: *seed
    verbose: false
    allow_writing_files: false
