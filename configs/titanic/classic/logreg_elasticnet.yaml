experiment:
  name: "logreg_elasticnet"
  seed: &seed 42

data:
  target: "Survived"
  original:
    train_path: "data/titanic/processed/raw/train_dataset.parquet"
    test_path: "data/titanic/processed/raw/test_dataset.parquet"
  binned:
    train_path: "data/titanic/processed/raw/train_dataset.parquet"
    test_path: "data/titanic/processed/raw/test_dataset.parquet"


validation:
  type: "stratified_kfold"
  n_splits: 5
  shuffle: true
  random_state: *seed

metrics:
  primary: "f1"
  log:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"
    
preprocessing:
  scaler: "standard"

model:
  name: "logistic_regression"
  params:
    C: 1.0
    l1_ratio: 0.5
    solver: "saga"
    max_iter: 1000
    tol: 0.001
    fit_intercept: true
    random_state: *seed