experiment:
  name: ensembles
  seed: &seed 42

data:
  target: Survived
  original:
    train_path: data/titanic/processed/raw/train_dataset.parquet
    test_path: data/titanic/processed/raw/test_dataset.parquet
  binned:
    train_path: data/titanic/processed/raw/train_dataset.parquet
    test_path: data/titanic/processed/raw/test_dataset.parquet

validation:
  n_splits: 5
  shuffle: true
  random_state: *seed

metrics:
  primary: f1
  log: [accuracy, precision, recall, f1, roc_auc]

base_configs:
  - configs/titanic/classic/logreg_l2.yaml
  - configs/titanic/classic/random_forest_classifier.yaml
  - configs/titanic/classic/catboost_classifier.yaml

methods: [average, voting_hard, voting_soft, stacking_linear, stacking_ridge]

voting:
  weights: [1, 2, 2]

stacking:
  n_splits: 5
  linear:
    fit_intercept: true
  ridge:
    alpha: 1.0
    fit_intercept: true
