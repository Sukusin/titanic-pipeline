experiment:
  name: "model_two"
  seed: &seed 42
  device: "auto"

data:
  target: "Survived"
  original:
    train_path: "data/processed/original/train_dataset.parquet"
    test_path: "data/processed/original/test_dataset.parquet"
  binned:
    train_path: "data/processed/binned/train_dataset.parquet"
    test_path: "data/processed/binned/test_dataset.parquet"

validation:
  type: "stratified_kfold"
  n_splits: 5
  shuffle: true
  random_state: *seed

preprocessing:
  scaler: "standard"

metrics:
  primary: "f1"
  log:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"

model:
  name: "model_one"
  params: 
    hidden_features: 32
    out_features: 1

criterion:
  name: "bce_with_logits"

optimizer:
  name: "adam"
  params:
    lr: 0.001

scheduler:
  name: "cosine"
  params:
    T_max: 20
    eta_min: 0.00001

training:
  epochs: 50
  batch_size: 32
