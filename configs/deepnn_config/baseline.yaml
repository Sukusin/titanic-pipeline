experiment:
  name: "Baseline model"
  seed: &seed 42
  device: "cuda"

data:
  target: "Survived"
  original:
    train_path: "data/processed/original/train_dataset.parquet"
    test_path: "data/processed/original/test_dataset.parquet"
  binned:
    train_path: "data/processed/binned/train_dataset.parquet"
    test_path: "data/processed/binned/test_dataset.parquet"

validation:
  type: "stratified_kfold"
  n_splits: 5
  shuffle: true
  random_state: *seed

preprocessing:
  scaler: "standard"

metrics:
  primary: "accuracy"
  log:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"

model:
  name: "baseline_model"

optimizer:
  name: "adam"
  step: 0.001

training:
  epochs: 10
  batch_size: 32